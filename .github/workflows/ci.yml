name: Release candidate checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Server ESLint (zero errors required)
        run: npx eslint server/src/ server/test/
      - name: Frontend ESLint (zero errors required)
        run: npm run lint:frontend
      - name: Prettier (format check)
        run: npm run format:check
      - name: TypeScript Typecheck (zero errors required)
        run: npm run typecheck
      - name: Frontend Build (production bundle)
        run: npm run build:frontend

  server:
    name: Server Tests & Verification
    needs: quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      NODE_ENV: test
      FIREBASE_PROJECT_ID: dealforge-507515
      GCP_PROJECT_ID: dealforge-507515
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Set up Java 21 for Firebase Emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Backend Syntax & Module Check
        run: npm run check
      - name: Server Unit, Integration, Contract, Adversarial & E2E Tests (with Coverage)
        run: npm run test:coverage
      - name: Firestore Security Rules Emulator Test
        run: npx firebase-tools --config ../firebase.json emulators:exec --only firestore "node --test test/firestore-emulator.test.js"

  publication-safety:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify secret-bearing files are not tracked
        run: |
          ! git ls-files | grep -E '(^|/)(\\.env|firebaseConfig\\.local\\.js|.*\\.log)$'
      - name: Scan tracked text for private keys and Firebase API keys
        run: |
          ! git grep -nE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|AIza[0-9A-Za-z_-]{20,}'
