<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — DealForge</title>
  <link rel="icon" href="/favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="page-auth">

  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="logo">
        <img src="/DealForge-logo.png" alt="DealForge" style="height: 48px;">
      </a>
    </div>
  </nav>

  <div class="auth-container">
    <div class="auth-header">
      <h1 class="auth-title">Manager Sign In</h1>
      <p>Use the account your DealForge administrator invited.</p>
    </div>

    <form class="auth-form" onsubmit="event.preventDefault(); handleEmailAuth();">
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" id="email" class="form-input" placeholder="name@company.com" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="form-input-wrapper">
          <input type="password" id="password" class="form-input" placeholder="••••••••" required>
          <button type="button" class="password-toggle" onclick="togglePassword()" aria-label="Toggle password visibility">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-primary" id="email-sign-in-btn">Sign In</button>
      <p id="error-message" style="color: var(--red); font-size: 12px; margin-top: 8px; text-align: center; display: none;"></p>
    </form>

    <p style="font-size: 13px; color: var(--mute); line-height: 1.5; margin: 16px 0 0; text-align: center;">Manager accounts are invite-only. Contact your DealForge administrator if you need access.</p>

    <div class="divider">
      <span class="divider-text">Or Continue With</span>
    </div>

    <button type="button" class="btn-secondary" onclick="signInWithGoogle()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Continue with Google
    </button>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <!-- Auth Integration -->
  <script src="/__/firebase/init.js"></script>
  <script src="/js/firebaseConfig.js"></script>
  <script src="/js/auth.js"></script>

  <script>
    function togglePassword() {
      const input = document.getElementById('password');
      if (input.type === 'password') {
        input.type = 'text';
      } else {
        input.type = 'password';
      }
    }

    async function handleEmailAuth() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const btn = document.getElementById('email-sign-in-btn');
      const errorMsg = document.getElementById('error-message');

      const originalText = btn.innerText;
      btn.innerText = 'Signing in...';
      btn.disabled = true;
      errorMsg.style.display = 'none';

      try {
        await signInWithEmail(email, password);
        // auth.js handles redirect on success
      } catch (err) {
        btn.innerText = originalText;
        btn.disabled = false;
        errorMsg.innerText = err.message;
        errorMsg.style.display = 'block';
      }
    }
  </script>
</body>
</html>
