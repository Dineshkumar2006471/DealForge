      <button class="btn-secondary" onclick="signOut()" style="padding: 12px; width: 100%; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        Sign Out

  <div class="main-content">
    <header class="topbar">
      <div class="topbar-left"><div class="topbar-title">Analytics</div></div>
      <div class="topbar-right">
        <div class="user-profile" style="flex-direction: row-reverse;">
          <div class="user-info" style="align-items: flex-start; margin-right: 12px;">
            <span class="user-name" id="user-display-name">Loading...</span>
            <span class="user-role">Sales Manager</span>
          </div>
          <div class="user-avatar" id="user-email" style="width: 36px; height: 36px;">...</div>
        </div>
      </div>
    </header>

    <main class="container" style="padding: 24px 32px 48px;">
      <!-- Summary Stats -->
      <div class="analytics-stats">
        <div class="bento-card" style="align-items: center; text-align: center;">
          <div style="font-family: var(--font-mono); font-size: 11px; color: var(--mute); text-transform: uppercase; margin-bottom: 8px;">Total Pipeline</div>
          <div class="viz-value-xl" id="stat-pipeline">$0</div>
        </div>
        <div class="bento-card" style="align-items: center; text-align: center;">
          <div style="font-family: var(--font-mono); font-size: 11px; color: var(--mute); text-transform: uppercase; margin-bottom: 8px;">Active Negotiations</div>
          <div class="viz-value-xl" id="stat-active">0</div>
        </div>
        <div class="bento-card" style="align-items: center; text-align: center;">
          <div style="font-family: var(--font-mono); font-size: 11px; color: var(--mute); text-transform: uppercase; margin-bottom: 8px;">Won Deals</div>
          <div class="viz-value-xl" style="color: var(--green);" id="stat-won">0</div>
        </div>
        <div class="bento-card" style="align-items: center; text-align: center;">
          <div style="font-family: var(--font-mono); font-size: 11px; color: var(--mute); text-transform: uppercase; margin-bottom: 8px;">Evidence Confidence</div>
          <div class="viz-value-xl" style="color: var(--amber);" id="stat-confidence">—</div>
        </div>
      </div>

      <div class="analytics-grid">
        <!-- Tool Usage -->
        <div class="bento-card">
          <div class="bento-header"><h3>Tool Execution Breakdown</h3></div>
          <div id="tool-stats" style="display: flex; flex-direction: column; gap: 12px;">
            <div style="color: var(--mute); font-size: 13px;">Loading...</div>
          </div>
        </div>

        <!-- Policy Events -->
        <div class="bento-card">
          <div class="bento-header"><h3>Policy Engine Activity</h3></div>
          <div id="policy-stats" style="display: flex; flex-direction: column; gap: 12px;">
            <div style="color: var(--mute); font-size: 13px;">Loading...</div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="/__/firebase/init.js"></script>
  <script src="/js/firebaseConfig.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    const db = getFirestore();
    function node(tag, text, styles = {}) {
      const element = document.createElement(tag);
      if (text !== undefined) element.textContent = text;
      Object.assign(element.style, styles);
      return element;
    }

    function unavailable(message) {
      return node('div', message, { color: 'var(--mute)', fontSize: '13px' });
    }

    firebase.auth().onAuthStateChanged(async (user) => {
      if (user) {
        if (!await window.managerReady) return;
        renderProfileIcon('user-email');
        document.getElementById('user-display-name').innerText = user.displayName || user.email || 'User';
        loadAnalytics();
      } else { window.location.href = '/login.html'; }
    });

    async function loadAnalytics() {
      const toolEl = document.getElementById('tool-stats');
      const policyEl = document.getElementById('policy-stats');
      try {
      // Pipeline belongs to customer negotiations, not their shared parent
      // accounts. Fetching each server-created snapshot preserves isolation.
      const sessionsSnap = await db.collection('callSessions').where('organizationId', '==', window.managerOrganizationId).get();
      const negotiations = await Promise.all(sessionsSnap.docs.map(async doc => {
        const session = doc.data();
        const stateDoc = await db.collection('callSessions').doc(session.sessionId).collection('state').doc('current').get();
        return { session, state: stateDoc.exists ? stateDoc.data() : {} };
      }));
      let totalArr = 0, activeCount = 0, wonCount = 0;
      negotiations.forEach(({ session, state }) => {
        if (!['ENDED', 'FAILED', 'REVOKED'].includes(session.status)) totalArr += Number(state.listPrice || state.arr) || 0;
        if (!['ENDED', 'FAILED', 'REVOKED', 'CLOSED_WON', 'CLOSED_LOST'].includes(session.status) && !['CLOSED_WON', 'CLOSED_LOST'].includes(state.status)) activeCount++;
        if (state.status === 'CLOSED_WON') wonCount++;
      });
      document.getElementById('stat-pipeline').innerText = new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(totalArr);
      document.getElementById('stat-active').innerText = activeCount;
      document.getElementById('stat-won').innerText = wonCount;
      const evidenceSnap = await db.collection('evidence').where('organizationId', '==', window.managerOrganizationId).get();
      let totalConf = 0;
      let confCount = 0;
      evidenceSnap.forEach(doc => {
         const conf = doc.data().confidence;
         if (typeof conf === 'number') {
            totalConf += conf;
            confCount++;
         }
      });
      if (confCount > 0) {
         document.getElementById('stat-confidence').innerText = Math.round((totalConf / confCount) * 100) + '%';
      } else {
         document.getElementById('stat-confidence').innerText = '—';
      }

      // Load without an ordered remote query so the dashboard has a graceful path while
      // the optional analytics index is building; the rendered set is still bounded.
      const auditSnap = await db.collection('auditEvents').where('organizationId', '==', window.managerOrganizationId).get();
      const toolCounts = {};
      const policyCounts = {};
      auditSnap.docs.sort((left, right) => {
        const a = left.data().timestamp, b = right.data().timestamp;
        const at = a?.toMillis?.() || Date.parse(a || '') || 0, bt = b?.toMillis?.() || Date.parse(b || '') || 0;
        return bt - at;
      }).slice(0, 50).forEach(doc => {
        const ev = doc.data();
        if (ev.eventType === 'TOOL_EXECUTED') {
          const name = String(ev.trigger || 'unknown').split('(')[0] || 'unknown';
          toolCounts[name] = (toolCounts[name] || 0) + 1;
        }
        policyCounts[ev.eventType] = (policyCounts[ev.eventType] || 0) + 1;
      });

      // Render event labels through DOM text nodes; audit data is untrusted.
      const maxTool = Math.max(...Object.values(toolCounts), 1);
      const toolNodes = [];
      Object.entries(toolCounts).forEach(([name, count]) => {
        const pct = (count / maxTool) * 100;
        const item = node('div');
        const top = node('div', undefined, { display: 'flex', justifyContent: 'space-between', marginBottom: '4px' });
        top.append(node('span', name, { fontFamily: 'var(--font-mono)', fontSize: '12px', textTransform: 'uppercase' }), node('span', `${count}x`, { fontFamily: 'var(--font-mono)', fontSize: '12px', color: 'var(--amber)' }));
        const track = node('div', undefined, { height: '6px', background: 'var(--canvas)', borderRadius: '3px', overflow: 'hidden' });
        track.append(node('div', undefined, { height: '100%', width: `${pct}%`, background: 'var(--amber)', borderRadius: '3px', transition: 'width 0.6s' }));
        item.append(top, track);
        toolNodes.push(item);
      });
      toolEl.replaceChildren(...(toolNodes.length ? toolNodes : [unavailable('No tool executions recorded.')]));

      // Render policy stats
      const policyNodes = [];
      Object.entries(policyCounts).forEach(([type, count]) => {
        const color = String(type).includes('WARNING') ? 'var(--red)' : String(type).includes('EXECUTED') ? 'var(--green)' : 'var(--amber)';
        const item = node('div', undefined, { display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '8px', background: 'var(--canvas)', borderRadius: '8px' });
        const badge = node('span', String(count), { fontSize: '10px', padding: '2px 8px', color, borderColor: color });
        badge.className = 'pill-badge';
        item.append(node('span', type.replace(/_/g, ' '), { fontFamily: 'var(--font-mono)', fontSize: '11px', textTransform: 'uppercase', color: 'var(--ink)' }), badge);
        policyNodes.push(item);
      });
      policyEl.replaceChildren(...(policyNodes.length ? policyNodes : [unavailable('No policy events.')]));
      } catch (error) {
        console.error('Unable to load analytics:', error);
        document.getElementById('stat-pipeline').innerText = '—';
        document.getElementById('stat-active').innerText = '—';
        document.getElementById('stat-won').innerText = '—';
        document.getElementById('stat-confidence').innerText = '—';
        toolEl.replaceChildren(unavailable('Analytics are temporarily unavailable. Refresh this workspace to try again.'));
        policyEl.replaceChildren(unavailable('Analytics are temporarily unavailable. Refresh this workspace to try again.'));
      }
    }
  </script>
</body>
</html>
